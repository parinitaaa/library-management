  <style>

<body class="bg-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { motion, AnimatePresence, useInView } = window.Motion;

    const CustomAlert = ({ message, type = 'info', onClose }) => {
      const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️', premium: '🔒' };
      const colors = { success: 'from-green-500 to-emerald-500', error: 'from-red-500 to-pink-500', warning: 'from-yellow-500 to-orange-500', info: 'from-blue-500 to-cyan-500', premium: 'from-orange-500 to-yellow-500' };

      return (
        <motion.div className="fixed inset-0 bg-black/80 backdrop-blur-xl z-[100] flex items-center justify-center p-4" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} onClick={onClose}>
          <motion.div className="bg-gradient-to-br from-zinc-900 via-zinc-800 to-zinc-900 rounded-3xl p-8 max-w-md w-full border-4 border-orange-500/50 relative overflow-hidden" initial={{ scale: 0, rotate: -180 }} animate={{ scale: 1, rotate: 0 }} exit={{ scale: 0, rotate: 180 }} transition={{ type: "spring", stiffness: 200, damping: 20 }} onClick={(e) => e.stopPropagation()}>
            {[...Array(20)].map((_, i) => (

    const RocketToBookAnimation = () => {
      const [stage, setStage] = useState('rocket');
      const [currentPage, setCurrentPage] = useState(0);

      const bookPages = [
        { title: "Welcome to Nexus", content: "Embark on an extraordinary journey through endless knowledge. Your gateway to academic excellence awaits." },

        { title: "Unlimited Access", content: "Access 1200+ premium books anytime, anywhere. Seamless synchronization across all your devices." },
        { title: "Community Learning", content: "Connect with fellow readers, share insights. Join study groups and vibrant book clubs." },

        const timer1 = setTimeout(() => setStage('floating'), 1200);
        const timer2 = setTimeout(() => setStage('book'), 3000);

                              </motion.div>

                              <motion.p className="text-2xl md:text-3xl text-white/95 leading-relaxed font-light tracking-wide" animate={{ opacity: currentPage === index ? 1 : 0 }} transition={{ duration: 0.8 }}>{page.content}</motion.p>
                            </div>

                            <div className="absolute bottom-12 left-14 right-14">
                              <div className="flex gap-4 justify-center">
                                {bookPages.map((_, i) => (
                                  <motion.div key={i} className={`h-2 rounded-full transition-all duration-500 ${i === currentPage ? 'w-20 bg-gradient-to-r from-orange-500 to-yellow-500' : 'w-10 bg-orange-500/30'}`} animate={i === currentPage ? { scale: [1, 1.2, 1] } : {}} transition={{ duration: 1.5, repeat: Infinity }} />
                                ))}
                              </div>
                            </div>

                            <motion.div className="absolute inset-0 bg-gradient-to-r from-transparent via-orange-500/20 to-transparent" initial={{ x: '-100%' }} animate={{ x: '200%' }} transition={{ duration: 3, repeat: Infinity, repeatDelay: 2 }} />
                          </div>
                        </div>

                        <div className="absolute inset-0 backface-hidden" style={{ transform: 'rotateY(180deg)' }}>
                          <div className="w-full h-full bg-gradient-to-bl from-zinc-900 via-zinc-950 to-black border-4 border-yellow-500/70 rounded-3xl p-8 flex items-center justify-center">
                            <div className="text-center">
                              <motion.div className="text-7xl mb-8" animate={{ rotateY: 360, scale: [1, 1.3, 1] }} transition={{ duration: 4, repeat: Infinity }}>✨</motion.div>
                              <p className="text-yellow-400/70 font-['Orbitron'] text-3xl font-bold tracking-[0.3em]">NEXUS</p>
                            </div>
                          </div>
                        </div>
                      </motion.div>
                    ))}

                    <motion.div className="absolute inset-0 rounded-3xl pointer-events-none border-4 border-orange-500/60" animate={{ boxShadow: ['0 0 40px rgba(255, 138, 0, 0.5), inset 0 0 40px rgba(255, 138, 0, 0.2)', '0 0 80px rgba(255, 138, 0, 0.8), inset 0 0 80px rgba(255, 138, 0, 0.4)', '0 0 40px rgba(255, 138, 0, 0.5), inset 0 0 40px rgba(255, 138, 0, 0.2)'] }} transition={{ duration: 3, repeat: Infinity }} />
                  </div>

                  <div className="absolute inset-0 pointer-events-none" style={{ zIndex: 1 }}>
                    {[...Array(12)].map((_, i) => (
                      <motion.div key={i} className="absolute w-2 h-2 bg-gradient-to-r from-orange-500 to-yellow-500 rounded-full" style={{ left: `${10 + (i % 4) * 25}%`, top: `${10 + Math.floor(i / 4) * 30}%` }} animate={{ y: [0, -50, 0], x: [0, (i % 2 ? 20 : -20), 0], opacity: [0, 0.8, 0], scale: [0, 2, 0] }} transition={{ duration: 4, repeat: Infinity, delay: i * 0.3 }} />
                    ))}
                  </div>
                </div>
              </motion.div>

        </div>
      );
    };

    const SuccessModal = ({ type, onClose }) => {
      useEffect(() => { const timer = setTimeout(onClose, 5000); return () => clearTimeout(timer); }, [onClose]);
      
      return (
        <motion.div className="fixed inset-0 bg-black/95 backdrop-blur-xl z-[100] flex items-center justify-center p-4" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} onClick={onClose}>
          <motion.div className="bg-gradient-to-br from-zinc-900 to-zinc-800 rounded-3xl p-12 max-w-md w-full border-4 border-orange-500 relative" initial={{ scale: 0, rotate: -180 }} animate={{ scale: 1, rotate: 0 }} exit={{ scale: 0, rotate: 180 }} transition={{ type: "spring", stiffness: 200, damping: 20 }} onClick={(e) => e.stopPropagation()}>
            <div className="text-center">
              <div className="w-32 h-32 bg-gradient-to-br from-orange-500 to-yellow-500 rounded-full flex items-center justify-center mx-auto mb-6">
                <motion.div className="text-7xl" animate={{ rotate: 360, scale: [1, 1.2, 1] }} transition={{ duration: 1 }}>{type === 'register' ? '🎉' : '✅'}</motion.div>
              </div>
              <motion.h2 className="text-5xl font-black font-['Orbitron'] bg-gradient-to-r from-orange-500 to-yellow-500 bg-clip-text text-transparent mb-6" animate={{ scale: [1, 1.08, 1] }} transition={{ duration: 1.2, repeat: Infinity }}>{type === 'register' ? 'Welcome Aboard!' : 'Login Successful!'}</motion.h2>
              <p className="text-2xl text-white/90 mb-10">{type === 'register' ? 'Your journey begins now' : 'Great to see you again!'}</p>
              <motion.div className="flex gap-6 justify-center mb-8">
                {['🚀', '📚', '✨'].map((emoji, i) => (
                  <motion.div key={i} className="text-5xl" animate={{ y: [0, -15, 0], rotate: [0, 15, -15, 0] }} transition={{ duration: 1, repeat: Infinity, delay: i * 0.2 }}>{emoji}</motion.div>
                ))}
              </motion.div>
              <motion.button onClick={onClose} className="px-12 py-5 bg-gradient-to-r from-orange-500 to-yellow-500 rounded-full font-bold text-xl" whileHover={{ scale: 1.08 }} whileTap={{ scale: 0.95 }}>Start Exploring</motion.button>
            </div>
          </motion.div>
        </motion.div>
      );
    };

    const PDFViewer = ({ book, onClose }) => {
  const [minimalMode, setMinimalMode] = React.useState(true);
  React.useEffect(() => {
  const container = document.getElementById("pdf-container");
  if (!container || !book?.pdf || !window.pdfjsLib) return;

  container.innerHTML = "";

  const loadingTask = window.pdfjsLib.getDocument(book.pdf);

  loadingTask.promise.then(async pdf => {
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale: 1.3 });

      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");

      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({
        canvasContext: context,
        viewport
      }).promise;

      canvas.className = "mb-6 mx-auto block rounded-lg shadow";
      container.appendChild(canvas);
    }
  });
}, [book.pdf]);


  return (
    <div className={`pdf-reader-page ${minimalMode ? 'reader-minimal' : ''}`}>
      <div className="max-w-7xl mx-auto">

        {/* Header */}

              <p className="text-white/80 text-xl mb-2">by {book.author}</p>
              <p className="text-white/60">{book.description}</p>
            </div>

            {/* Action buttons */}
            <div className="flex gap-3 flex-wrap items-center">
              <motion.button
                onClick={() => setMinimalMode(v => !v)}
                className="px-5 py-2 rounded-full border border-white/20 text-sm hover:bg-white/10 transition"
                whileHover={{ scale: 1.05 }}
                whileTap={{ scale: 0.95 }}
              >
                {minimalMode ? 'Cinematic UI' : 'Minimal Reader'}

              <motion.a
                href={book.pdf}
                target="_blank"

                className="px-6 py-3 bg-gradient-to-r from-orange-500 to-yellow-500 rounded-full font-semibold flex items-center gap-2"

                whileHover={{ scale: 1.05 }}
                whileTap={{ scale: 0.95 }}
              >
                ✕ Close Reader

            </div>
          </div>
        </div>

        {/* PDF frame */}
        <div className="reader-card rounded-2xl p-3">
          <div
               id="pdf-container"
               className="w-full h-[80vh] overflow-y-auto rounded-xl bg-neutral-900 p-4"
           ></div>

        </div>

        {/* Tip */}
        <div className="mt-6 text-center">
          <motion.div
            className="bg-orange-500/10 border border-orange-500/30 rounded-2xl p-4 inline-block"
            animate={{ scale: [1, 1.02, 1] }}
            transition={{ duration: 2, repeat: Infinity }}
          >
            <p className="text-white/70 text-sm">
              💡 <span className="text-orange-400 font-semibold">Pro Tip:</span>{' '}
              Click "Open Full Screen" button above for the best reading experience with zoom controls
            </p>
          </motion.div>
        </div>

      </div>
    </div>
  );
};
    const LibraryApp = () => {

                    <h3 className="text-xl font-bold text-orange-500 mb-4">Order Summary</h3>
                    <div className="space-y-2 text-white/80">
                      <div className="flex justify-between"><span>Plan:</span><span className="font-semibold">{selectedPlan.name}</span></div>
                      <div className="flex justify-between"><span>Duration:</span><span>1 Month</span></div>
                      <div className="flex justify-between border-t border-orange-500/30 pt-2 mt-2 text-xl font-bold text-orange-500"><span>Total:</span><span>₹{selectedPlan.price}</span></div>
                    </div>
                  </div>
                  <h4 className="text-lg font-semibold mb-4">Select Payment Method</h4>
                  <div className="grid grid-cols-2 gap-4 mb-6">
                    {['UPI', 'Card', 'NetBanking', 'Wallet'].map((method) => (
                      <motion.button key={method} onClick={() => setPaymentMethod(method)} className={`p-4 rounded-xl border-2 transition-all font-semibold ${paymentMethod === method ? 'border-orange-500 bg-orange-500/20' : 'border-orange-500/20 bg-white/5'}`} whileHover={{ scale: 1.05 }} whileTap={{ scale: 0.95 }}>{method}</motion.button>
                    ))}
                  </div>
                  {paymentMethod === 'UPI' && (
                    <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} className="mb-6 space-y-3">
                      <label className="block text-sm text-white/80">UPI ID</label>
                      <input type="text" placeholder="yourname@upi" className="w-full bg-white/5 border-2 border-orange-500/20 rounded-xl px-4 py-3 focus:border-orange-500 focus:outline-none transition-colors" value={paymentDetails.upiId} onChange={(e) => setPaymentDetails({...paymentDetails, upiId: e.target.value})} />
                    </motion.div>
                  )}
                  {paymentMethod === 'Card' && (
                    <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} className="mb-6 space-y-3">
                      <div><label className="block text-sm text-white/80 mb-2">Card Number</label><input type="text" placeholder="1234 5678 9012 3456" maxLength="19" className="w-full bg-white/5 border-2 border-orange-500/20 rounded-xl px-4 py-3 focus:border-orange-500 focus:outline-none transition-colors" value={paymentDetails.cardNumber} onChange={(e) => setPaymentDetails({...paymentDetails, cardNumber: e.target.value})} /></div>
                      <div className="grid grid-cols-2 gap-3">
                        <div><label className="block text-sm text-white/80 mb-2">Expiry</label><input type="text" placeholder="MM/YY" maxLength="5" className="w-full bg-white/5 border-2 border-orange-500/20 rounded-xl px-4 py-3 focus:border-orange-500 focus:outline-none transition-colors" /></div>
                        <div><label className="block text-sm text-white/80 mb-2">CVV</label><input type="text" placeholder="123" maxLength="3" className="w-full bg-white/5 border-2 border-orange-500/20 rounded-xl px-4 py-3 focus:border-orange-500 focus:outline-none transition-colors" value={paymentDetails.cvv} onChange={(e) => setPaymentDetails({...paymentDetails, cvv: e.target.value})} /></div>
                      </div>
                    </motion.div>
                  )}
                  <motion.button onClick={processPayment} className="w-full py-4 bg-gradient-to-r from-orange-500 to-yellow-500 rounded-full font-bold text-lg shadow-lg" whileHover={{ scale: 1.02 }} whileTap={{ scale: 0.98 }}>Pay ₹{selectedPlan.price}</motion.button>
                </motion.div>
              </motion.div>
            )}

            {successModal && <SuccessModal type={successModal} onClose={() => setSuccessModal(null)} />}
            {customAlert && <CustomAlert message={customAlert.message} type={customAlert.type} onClose={() => setCustomAlert(null)} />}
          </AnimatePresence>
        </div>
      );
    };

    ReactDOM.render(<LibraryApp />, document.getElementById('root'));
  </script>
</body>
</html>
